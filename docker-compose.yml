services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aqtau_safe}
      POSTGRES_USER: ${POSTGRES_USER:-aqtau}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aqtau} -d ${POSTGRES_DB:-aqtau_safe}"]
      interval: 5s
      timeout: 3s
      retries: 10
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-aqtau}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-aqtau_safe}?schema=public
      WATCHPACK_POLLING: "true"
      # Время в интерфейсе — по Актау (UTC+5), а не UTC контейнера
      TZ: ${TZ:-Asia/Aqtau}
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    volumes:
      - ./src:/app/src
      - ./public:/app/public
      - ./prisma:/app/prisma
      - uploads_data:/app/data
      - ./next.config.ts:/app/next.config.ts:ro
      - ./tailwind.config.ts:/app/tailwind.config.ts:ro
      - ./postcss.config.js:/app/postcss.config.js:ro
      - ./tsconfig.json:/app/tsconfig.json:ro
    depends_on:
      db:
        condition: service_healthy
      cv:
        condition: service_started
    command: sh -c "npx prisma migrate deploy && npm run db:seed && npm run dev:next"
  # CV-сервис (FastAPI): детектор повреждений дорог и эвристика падения. Раньше был только в
  # docker-compose.prod.yml, поэтому локально конвейер камер не работал.
  cv:
    build:
      context: ./services/cv
    environment:
      POSE_MODEL_PATH: /models/pose_landmarker_lite.task
      CV_SERVICE_KEY: ${CV_SERVICE_KEY:?Set CV_SERVICE_KEY in .env}
      DEMO_MODE: ${DEMO_MODE:-true}
      DEMO_FALL_TIMEOUT: ${DEMO_FALL_TIMEOUT:-8}
      FALL_TIMEOUT: ${FALL_TIMEOUT:-240}
      ENABLE_FIGHT: ${ENABLE_FIGHT:-false}
    ports:
      - "127.0.0.1:8000:8000"
volumes:
  postgres_data:
  uploads_data:
