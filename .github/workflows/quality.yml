name: Quality checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: aqtau_test
          POSTGRES_USER: aqtau
          POSTGRES_PASSWORD: ci-local-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aqtau -d aqtau_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://aqtau:ci-local-only@localhost:5432/aqtau_test
      SESSION_SECRET: ci-only-session-secret-at-least-32-characters
      DEMO_MODE: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run check
      - run: npm run db:deploy
      - run: npm run test:integration
      - run: python -m unittest discover -s services/cv -p test_detectors.py
      - run: npm audit --audit-level=high
      - run: npm run build
